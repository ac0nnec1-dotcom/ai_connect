<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Connect</title>

  <style>
    /* ==== ESTILOS BASE ==== */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
    }

    .logo img {
      height: 50px;
      object-fit: contain;
    }

    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #000;
      font-weight: 500;
    }

    .carrito {
      font-weight: bold;
    }

    .productos {
      padding: 30px 20px;
      text-align: center;
    }

    .productos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .producto-card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    /* ==== RESPONSIVE ==== */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 12px;
      }

      nav {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }

      .productos-grid {
        grid-template-columns: 1fr;
        width: 100%;
      }
    }

    @media (max-width: 400px) {
      nav a {
        font-size: 14px;
      }

      .logo img {
        height: 40px;
      }
    }
  </style>

</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="AI Connect Logo">
    </div>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Quiénes Somos</a>
      <a href="#">Productos</a>
      <a href="#">Referencias</a>
      <a href="#">Contacto</a>
      <a href="#" class="carrito">🛒 Carrito</a>
    </nav>
  </header>

  <!-- CONTENIDO -->
  <main>
    <section class="productos">
      <h2>Nuestros Productos</h2>
      <div class="productos-grid">
        <div class="producto-card">
          <img src="{{ url_for('static', filename='chatbot.jpg') }}" alt="Chatbot">
          <h3>Chatbot Inteligente</h3>
          <p>$199</p>
        </div>
        <div class="producto-card">
          <img src="{{ url_for('static', filename='webdesign.jpg') }}" alt="Web">
          <h3>Diseño Web Moderno</h3>
          <p>$299</p>
        </div>
        <div class="producto-card">
          <img src="{{ url_for('static', filename='automation.jpg') }}" alt="Automatización">
          <h3>Automatización Empresarial</h3>
          <p>$399</p>
        </div>
      </div>
    </section>
  </main>

  {% include 'footer.html' %}

</body>
</html>
